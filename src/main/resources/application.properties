spring.application.name=cycle-tracker

# Local development: file-based H2 database stored in ./data (git-ignored).
spring.datasource.url=jdbc:h2:file:./data/cycle-tracker
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jpa.open-in-view=false
