<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Daily logs')}"></head>
<body>
<header th:replace="~{fragments :: nav('logs')}"></header>
<main>
  <div class="row">
    <h1>Daily logs</h1>
    <span class="spacer"></span>
    <a class="btn btn-primary" th:href="@{/logs/day}">+ Log a day</a>
  </div>
  <p class="subtitle">Flow, symptoms and mood for each day you've logged.</p>
  <div th:replace="~{fragments :: flash}"></div>

  <div class="card">
    <div th:if="${logs.isEmpty()}" class="empty">No daily logs yet.</div>
    <div class="table-wrap" th:unless="${logs.isEmpty()}">
      <table>
        <thead>
        <tr><th>Date</th><th>Flow</th><th>Mood</th><th>Symptoms</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
          <td th:text="${#temporals.format(log.date, 'EEE d MMM')}"></td>
          <td>
            <span th:if="${log.flow.name() != 'NONE'}" class="tag tag-period" th:text="${log.flow.label}"></span>
            <span th:if="${log.flow.name() == 'NONE'}" class="muted">—</span>
          </td>
          <td th:text="${log.mood} ? ${log.mood.label} : '—'"></td>
          <td><span class="tag" th:each="s : ${log.symptoms}" th:text="${s.label}"></span></td>
          <td class="actions"><a th:href="@{/logs/day(date=${log.date})}">Edit</a></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
