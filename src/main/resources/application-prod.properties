# Production: PostgreSQL. All secrets come from environment variables, never from this file.
#   DATABASE_URL       e.g. jdbc:postgresql://host:5432/dbname?sslmode=require
#   DATABASE_USERNAME
#   DATABASE_PASSWORD
# Optional, for reminder emails: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
#   SPRING_MAIL_PASSWORD, APP_MAIL_FROM, APP_URL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
