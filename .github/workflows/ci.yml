name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t cycle-tracker .
      - name: Start the demo and check it responds
        run: |
          docker run -d --name app -p 8080:8080 -e SPRING_PROFILES_ACTIVE=demo cycle-tracker
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login > /dev/null; then echo "App is up"; exit 0; fi
            sleep 3
          done
          docker logs app
          exit 1
